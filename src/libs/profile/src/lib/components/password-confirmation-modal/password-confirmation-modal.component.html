<div class="password-modal">
  <h2 mat-dialog-title>Confirmar Senha</h2>
  
  <mat-dialog-content>
    <p class="modal-description">
      Para sua segurança, confirme sua senha atual para continuar com as alterações.
    </p>

    <form [formGroup]="passwordForm">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Senha Atual</mat-label>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="currentPassword"
          placeholder="Digite sua senha atual"
          autocomplete="current-password">
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword = !hidePassword"
          [attr.aria-label]="'Mostrar senha'"
          [attr.aria-pressed]="!hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="passwordForm.get('currentPassword')?.hasError('required')">
          Senha é obrigatória
        </mat-error>
        <mat-error *ngIf="passwordForm.get('currentPassword')?.hasError('minlength')">
          A senha deve ter no mínimo 6 caracteres
        </mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">
      Cancelar
    </button>
    <button mat-raised-button color="primary" (click)="confirm()">
      Confirmar
    </button>
  </mat-dialog-actions>
</div>
