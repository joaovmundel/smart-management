<div class="company-details">
    <div class="company-details__card">
        <div class="company-details__info-area">
            <div class="company-details__profile-photo">
                <img [src]="company.logoUrl" alt="Logo da empresa" />
            </div>
            <div class="company-details__info">
                <h2 class="company-details__name">{{ company.name }}</h2>
                <hr class="divider"/>
                <span class="company-details__info-group">
                    <mat-icon>badge</mat-icon>
                    <p class="company-details__cnpj">{{ company.cnpj }}</p>
                </span>
                <span class="company-details__info-group">
                    <mat-icon>email</mat-icon>
                    <p class="company-details__email">{{ company.email }}</p>
                </span>
                <span class="company-details__info-group">
                    <mat-icon>phone</mat-icon>
                    <p class="company-details__phone">{{ company.phone }}</p>
                </span>
                <span class="company-details__info-group">
                    <mat-icon>location_on</mat-icon>
                    <p class="company-details__location">{{ company.city }}, {{ company.state }}, {{ company.country }}</p>
                </span>
                <span class="company-details__info-group">
                    <mat-icon>public</mat-icon>
                    <a class="company-details__website" [href]="company.websiteUrl" target="_blank">{{ company.websiteUrl }}</a>
                </span>
            </div>
        </div>
        <div class="company-details__description">
            <h1>Descrição da empresa</h1>
            <p>
                {{ company.description }}
            </p>
        </div>
    </div>
    <users-list [tableOnly]="true"></users-list>
</div>
