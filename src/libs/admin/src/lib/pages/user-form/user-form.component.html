<div class="user-form-container">
  <form
    class="user-form"
    [formGroup]="userForm"
    (ngSubmit)="onSubmit()"
    autocomplete="off"
  >
    <h2 class="user-form-title">
      {{ isEdit ? 'Editar Usuário' : 'Adicionar Usuário' }}
    </h2>
    <div class="user-form-row">
      <mat-form-field appearance="fill" class="user-form-field half">
        <mat-label>Nome</mat-label>
        <input matInput type="text" formControlName="nome" required />
        <mat-error
          *ngIf="
            userForm.get('nome')?.hasError('required') &&
            userForm.get('nome')?.touched
          "
        >
          Nome é obrigatório
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="fill" class="user-form-field half">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" required />
        <mat-error
          *ngIf="
            userForm.get('email')?.hasError('required') &&
            userForm.get('email')?.touched
          "
        >
          Email é obrigatório
        </mat-error>
        <mat-error
          *ngIf="
            userForm.get('email')?.hasError('email') &&
            userForm.get('email')?.touched
          "
        >
          Email inválido
        </mat-error>
      </mat-form-field>
    </div>
    <div class="user-form-row">
      <mat-form-field appearance="fill" class="user-form-field half">
        <mat-label>Telefone</mat-label>
        <input matInput type="text" formControlName="phone" required />
        <mat-error
          *ngIf="
            userForm.get('phone')?.hasError('required') &&
            userForm.get('phone')?.touched
          "
        >
          Telefone é obrigatório
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="fill" class="user-form-field half" floatLabel="always">
        <mat-label>Empresa</mat-label>
        <input
          type="text"
          placeholder="Selecione a empresa"
          matInput
          [formControl]="companyFilterCtrl"
          [matAutocomplete]="autoCompany"
          [required]="true"
          (blur)="onCompanyBlur()"
        />
        <mat-autocomplete #autoCompany="matAutocomplete" (optionSelected)="onCompanySelected($event)">
          <mat-option *ngFor="let company of filteredCompanies" [value]="company.name">
            {{ company.name }}
          </mat-option>
        </mat-autocomplete>
        <mat-error *ngIf="userForm.get('company')?.hasError('required') && userForm.get('company')?.touched">
          Empresa é obrigatória
        </mat-error>
      </mat-form-field>
    </div>
    <div class="user-form-row" *ngIf="!isEdit">
      <mat-form-field appearance="fill" class="user-form-field half">
        <mat-label>Senha</mat-label>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          required
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword = !hidePassword"
        >
          <mat-icon>{{
            hidePassword ? 'visibility_off' : 'visibility'
          }}</mat-icon>
        </button>
        <mat-error
          *ngIf="
            userForm.get('password')?.hasError('minlength') &&
            userForm.get('password')?.touched
          "
        >
          Mínimo de 6 caracteres
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="fill" class="user-form-field half">
        <mat-label>Confirmar senha</mat-label>
        <input
          matInput
          [type]="hideConfirmPassword ? 'password' : 'text'"
          formControlName="confirmPassword"
          required
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hideConfirmPassword = !hideConfirmPassword"
        >
          <mat-icon>{{
            hideConfirmPassword ? 'visibility_off' : 'visibility'
          }}</mat-icon>
        </button>
        <mat-error
          *ngIf="
            userForm.hasError('passwordMismatch') &&
            userForm.get('confirmPassword')?.touched
          "
        >
          As senhas não coincidem
        </mat-error>
      </mat-form-field>
    </div>
    <mat-form-field appearance="fill" class="user-form-field full">
      <mat-label>Token de Registro</mat-label>
      <input matInput type="text" formControlName="tokenRegistro" />
    </mat-form-field>
    <div class="user-form-actions">
      <button
        mat-button
        color="accent"
        type="button"
        (click)="onCancel()"
        [disabled]="loading"
      >
        Cancelar
      </button>
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="loading"
      >
        <ng-container *ngIf="!loading">{{
          isEdit ? 'Salvar' : 'Adicionar'
        }}</ng-container>
        <ng-container *ngIf="loading">
          <mat-progress-spinner
            diameter="22"
            mode="indeterminate"
            color="accent"
            class="spinner-btn"
          ></mat-progress-spinner>
        </ng-container>
      </button>
    </div>
  </form>
</div>
