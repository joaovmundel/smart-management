<div class="users-container">
  <div class="users-header">
    <h2 *ngIf="!tableOnly" class="users-title">Gerenciar Usuários</h2>
    <div class="users-header__actions">
      <button
        *ngIf="!tableOnly"
        mat-raised-button
        color="primary"
        class="users-btn"
        (click)="redirectToCreateUser()"
      >
        Novo Usuário
      </button>
      <div class="users-search">
        <mat-form-field
          style="width: 100%; max-width: 350px"
          subscriptSizing="dynamic"
        >
          <mat-label>Buscar usuário</mat-label>
          <input
            matInput
            placeholder="Nome, email ou telefone"
            [(ngModel)]="searchTerm"
            (ngModelChange)="applyFilter()"
          />
          <mat-icon matSuffix>search</mat-icon>
          <button
            *ngIf="searchTerm"
            matSuffix
            mat-icon-button
            aria-label="Limpar"
            (click)="clearSearch()"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </div>
    </div>
  </div>
  <mat-card class="users-card">
    <mat-table
      [dataSource]="filteredUsers"
      class="users-table"
      *ngIf="filteredUsers.length; else empty"
    >
      <ng-container matColumnDef="id">
        <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
        <mat-cell *matCellDef="let user">{{ user.id }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="nome">
        <mat-header-cell *matHeaderCellDef>Nome</mat-header-cell>
        <mat-cell *matCellDef="let user">{{ user.name }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="telefone">
        <mat-header-cell *matHeaderCellDef>Telefone</mat-header-cell>
        <mat-cell *matCellDef="let user">{{ user.phone }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="email">
        <mat-header-cell *matHeaderCellDef>Email</mat-header-cell>
        <mat-cell *matCellDef="let user">{{ user.email }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="empresa">
        <mat-header-cell *matHeaderCellDef>Empresa</mat-header-cell>
        <mat-cell *matCellDef="let user">{{ user.company?.name }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="criadoEm">
        <mat-header-cell *matHeaderCellDef>Criado em</mat-header-cell>
        <mat-cell *matCellDef="let user">{{
          user.createdAt | date : 'short'
        }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="tokenRegistro">
        <mat-header-cell *matHeaderCellDef>Token de Registro</mat-header-cell>
        <mat-cell *matCellDef="let user">{{ user.registerToken }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef class="table-cell--actions"
          >Ações</mat-header-cell
        >
        <mat-cell
          *matCellDef="let user"
          class="users-actions-cell table-cell--actions"
        >
          <button
            mat-icon-button
            color="primary"
            (click)="editUser(user)"
            matTooltip="Editar"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            (click)="deleteUser(user)"
            matTooltip="Deletar"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </mat-cell>
      </ng-container>
      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
    </mat-table>
    <ng-template #empty>
      <div class="users-empty">Nenhum usuário encontrado.</div>
    </ng-template>
  </mat-card>
</div>
