<div class="token-creation">
  <h1 class="token-creation__title">Criar novo token</h1>
  <p class="token-creation__description">
    Gere um novo token de registro para permitir que novos usuários se inscrevam
    na plataforma.
  </p>
  <form [formGroup]="form" class="token-creation__form">
    <mat-form-field appearance="outline" class="token-creation__field">
      <mat-label>Token (UUID)</mat-label>
      <input matInput formControlName="token" readonly />
    </mat-form-field>
    <mat-form-field appearance="outline" class="token-creation__field">
      <mat-label>Empresa</mat-label>
      <input
        type="text"
        matInput
        [formControl]="empresaFilterCtrl"
        [matAutocomplete]="autoEmpresa"
        [required]="true"
        (blur)="onEmpresaBlur()"
      />
      <mat-autocomplete #autoEmpresa="matAutocomplete" (optionSelected)="onEmpresaSelected($event)">
        <mat-option *ngFor="let empresa of filteredEmpresas" [value]="empresa.nome">
          {{ empresa.nome }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>
    <button
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="form.invalid"
    >
      Criar Token
    </button>
    <button mat-flat-button color="secondary" type="button" (click)="close()">
      Cancelar
    </button>
  </form>
</div>
