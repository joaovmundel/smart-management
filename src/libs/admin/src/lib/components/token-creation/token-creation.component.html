<div class="token-creation">
  <h1 class="token-creation__title">Criar novo token</h1>
  <p class="token-creation__description">
    Gere um novo token de registro para permitir que novos usuários se inscrevam
    na plataforma.
  </p>
  <form [formGroup]="form" class="token-creation__form">
    <mat-form-field appearance="outline" class="token-creation__field">
      <mat-label>Token (UUID)</mat-label>
      <input matInput formControlName="token" readonly />
    </mat-form-field>
    <mat-form-field appearance="outline" class="token-creation__field">
      <mat-label>Empresa</mat-label>
      <input
        type="text"
        matInput
        [formControl]="companyFilterCtrl"
        [matAutocomplete]="autoCompany"
        [required]="true"
        (blur)="onCompanyBlur()"
      />
      <mat-autocomplete
        #autoCompany="matAutocomplete"
        (optionSelected)="onCompanySelected($event)"
      >
        <mat-option
          *ngFor="let company of filteredCompanies"
          [value]="company.name"
        >
          {{ company.name }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>
    <button
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="form.invalid"
      (click)="close(true)"
    >
      Criar Token
    </button>
    <button mat-flat-button color="secondary" type="button" (click)="close()">
      Cancelar
    </button>
  </form>
</div>
