<div class="register-container">
	<form class="register-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()" autocomplete="off">
		<h2 class="register-title">Registrar</h2>
		<div class="register-row">
			<mat-form-field appearance="fill" class="register-field half">
				<mat-label>Nome</mat-label>
				<input matInput type="text" formControlName="name" required />
				<mat-error *ngIf="registerForm.get('name')?.hasError('required') && registerForm.get('name')?.touched">
					Nome é obrigatório
				</mat-error>
			</mat-form-field>
			<mat-form-field appearance="fill" class="register-field half">
				<mat-label>Email</mat-label>
				<input matInput type="email" formControlName="email" required />
				<mat-error *ngIf="registerForm.get('email')?.hasError('required') && registerForm.get('email')?.touched">
					Email é obrigatório
				</mat-error>
				<mat-error *ngIf="registerForm.get('email')?.hasError('email') && registerForm.get('email')?.touched">
					Email inválido
				</mat-error>
			</mat-form-field>
		</div>
		<div class="register-row">
			<mat-form-field appearance="fill" class="register-field half">
				<mat-label>Senha</mat-label>
				<input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required />
				<button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
					<mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
				</button>
				<mat-error *ngIf="registerForm.get('password')?.hasError('required') && registerForm.get('password')?.touched">
					Senha é obrigatória
				</mat-error>
				<mat-error *ngIf="registerForm.get('password')?.hasError('minlength') && registerForm.get('password')?.touched">
					Mínimo de 6 caracteres
				</mat-error>
			</mat-form-field>
			<mat-form-field appearance="fill" class="register-field half">
				<mat-label>Confirmar senha</mat-label>
				<input matInput [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword" required />
				<button mat-icon-button matSuffix type="button" (click)="hideConfirmPassword = !hideConfirmPassword">
					<mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
				</button>
				<mat-error *ngIf="registerForm.get('confirmPassword')?.hasError('required') && registerForm.get('confirmPassword')?.touched">
					Confirmação obrigatória
				</mat-error>
				<mat-error *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched">
					As senhas não coincidem
				</mat-error>
			</mat-form-field>
		</div>
		<mat-form-field appearance="fill" class="register-field full">
			<mat-label>Telefone (opcional)</mat-label>
			<input matInput type="tel" formControlName="phone" />
		</mat-form-field>
		<div class="register-actions">
			<button mat-button color="accent" class="login-btn" type="button" (click)="goToLogin()" [disabled]="loading">Voltar ao login</button>
			<button mat-raised-button color="primary" class="register-btn" type="submit" [disabled]="loading">
				<ng-container *ngIf="!loading">Registrar</ng-container>
				<ng-container *ngIf="loading">
					<mat-progress-spinner diameter="22" mode="indeterminate" color="accent" class="spinner-btn"></mat-progress-spinner>
				</ng-container>
			</button>
		</div>
	</form>
</div>
