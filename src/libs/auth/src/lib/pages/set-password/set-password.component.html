<div class="setpw-container">
  <form
    class="setpw-form"
    [formGroup]="setPasswordForm"
    (ngSubmit)="onSubmit()"
    autocomplete="off"
  >
    <h2 class="setpw-title">Definir nova senha</h2>
    <div class="setpw-row">
      <mat-form-field appearance="fill" class="setpw-field full">
        <mat-label>Senha</mat-label>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          required
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword = !hidePassword"
          tabindex="-1"
        >
          <mat-icon>{{
            hidePassword ? 'visibility_off' : 'visibility'
          }}</mat-icon>
        </button>
        <mat-error
          *ngIf="
            setPasswordForm.get('password')?.hasError('required') &&
            setPasswordForm.get('password')?.touched
          "
        >
          Senha obrigatória
        </mat-error>
        <mat-error
          *ngIf="
            setPasswordForm.get('password')?.hasError('minlength') &&
            setPasswordForm.get('password')?.touched
          "
        >
          Mínimo de 6 caracteres
        </mat-error>
      </mat-form-field>
    </div>
    <div class="setpw-row">
      <mat-form-field appearance="fill" class="setpw-field full">
        <mat-label>Confirmar senha</mat-label>
        <input
          matInput
          [type]="hideConfirmPassword ? 'password' : 'text'"
          formControlName="confirmPassword"
          required
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hideConfirmPassword = !hideConfirmPassword"
          tabindex="-1"
        >
          <mat-icon>{{
            hideConfirmPassword ? 'visibility_off' : 'visibility'
          }}</mat-icon>
        </button>
        <mat-error
          *ngIf="
            setPasswordForm.get('confirmPassword')?.hasError('required') &&
            setPasswordForm.get('confirmPassword')?.touched
          "
        >
          Confirmação obrigatória
        </mat-error>
        <mat-error
          *ngIf="
            setPasswordForm.hasError('passwordMismatch') &&
            setPasswordForm.get('confirmPassword')?.touched
          "
        >
          As senhas não coincidem
        </mat-error>
      </mat-form-field>
    </div>
    <div class="setpw-actions">
      <button
        mat-raised-button
        color="primary"
        class="setpw-btn"
        type="submit"
        [disabled]="loading"
      >
        <ng-container *ngIf="!loading">Confirmar</ng-container>
        <ng-container *ngIf="loading">
          <mat-progress-spinner
            diameter="22"
            mode="indeterminate"
            color="accent"
            class="spinner-btn"
          ></mat-progress-spinner>
        </ng-container>
      </button>
    </div>
  </form>
</div>
