<div class="forgot-container">
  <form class="forgot-form" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" autocomplete="off">
    <h2 class="forgot-title">Recuperar senha</h2>
    <div class="forgot-row">
      <mat-form-field appearance="fill" class="forgot-field full">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" required />
        <mat-error *ngIf="forgotForm.get('email')?.hasError('required') && forgotForm.get('email')?.touched">
          Email é obrigatório
        </mat-error>
        <mat-error *ngIf="forgotForm.get('email')?.hasError('email') && forgotForm.get('email')?.touched">
          Email inválido
        </mat-error>
      </mat-form-field>
    </div>
    <div class="forgot-actions">
      <button mat-raised-button color="secondary" class="login-btn" type="button" (click)="goToLogin()" [disabled]="loading">Voltar ao login</button>
      <button mat-raised-button color="primary" class="forgot-btn" type="submit" [disabled]="loading">
        <ng-container *ngIf="!loading">Enviar código de recuperação</ng-container>
        <ng-container *ngIf="loading">
          <mat-progress-spinner diameter="22" mode="indeterminate" color="accent" class="spinner-btn"></mat-progress-spinner>
        </ng-container>
      </button>
    </div>
  </form>
</div>
