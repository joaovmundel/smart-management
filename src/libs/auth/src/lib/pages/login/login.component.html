
<div class="login-container">
  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">
    <h2 class="login-title">Login</h2>
    <div class="login-row">
      <mat-form-field appearance="fill" class="login-field full">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" required />
        <mat-error *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
          Email é obrigatório
        </mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched">
          Email inválido
        </mat-error>
      </mat-form-field>
    </div>
    <div class="login-row">
      <mat-form-field appearance="fill" class="login-field full">
        <mat-label>Senha</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required />
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" tabindex="-1">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
          Senha é obrigatória
        </mat-error>
      </mat-form-field>
    </div>
    <div class="login-actions">
      <button mat-button color="accent" class="register-btn" type="button" (click)="goToRegister()" [disabled]="loading">Registre-se</button>
      <button mat-raised-button color="primary" class="login-btn" type="submit" [disabled]="loading">
        <ng-container *ngIf="!loading">Login</ng-container>
        <ng-container *ngIf="loading">
          <mat-progress-spinner diameter="22" mode="indeterminate" color="accent" class="spinner-btn"></mat-progress-spinner>
        </ng-container>
      </button>
    </div>
    <div class="links">
      <a href="#" (click)="$event.preventDefault(); goToForgotPassword()">Esqueci a senha</a>
    </div>
  </form>
</div>
