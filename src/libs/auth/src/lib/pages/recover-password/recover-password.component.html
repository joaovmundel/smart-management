<div class="recover-container">
  <form class="recover-form" (ngSubmit)="onSubmit()" autocomplete="off">
    <h2 class="recover-title">Recuperar senha</h2>
    <div class="recover-row code-row">
      <label class="code-label">Código</label>
      <div class="code-inputs">
        <input *ngFor="let ctrl of codeControls; let i = index" maxlength="1" matInput type="text" class="code-box" [formControl]="ctrl" (input)="onCodeInput($event, i)" (keydown)="onCodeKeydown($event, i)" autocomplete="one-time-code" />
      </div>
    </div>
    <div class="recover-actions">
      <button mat-button color="accent" class="cancel-btn" type="button" (click)="goToLogin()" [disabled]="loading">Cancelar</button>
      <button mat-raised-button color="primary" class="recover-btn" type="submit" [disabled]="loading">
        <ng-container *ngIf="!loading">Verificar</ng-container>
        <ng-container *ngIf="loading">
          <mat-progress-spinner diameter="22" mode="indeterminate" color="accent" class="spinner-btn"></mat-progress-spinner>
        </ng-container>
      </button>
    </div>
  </form>
</div>
