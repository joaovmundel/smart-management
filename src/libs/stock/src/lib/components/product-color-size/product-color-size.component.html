<div class="product-color-size">
  <h1 class="product-color-size__title">Cadastrar cores e tamanhos para o produto</h1>
  <div class="product-color-size__forms-area">
    <div class="product-color-size__color-form">
      <h2 class="product-color-size__color-form-title">Adicionar nova variante de cor</h2>
      <form [formGroup]="colorForm" class="product-color-size__color-form-form">
        <mat-form-field class="product-color-size__color-form-field" appearance="outline">
          <mat-label>Nome da variante</mat-label>
          <input
            matInput
            placeholder="Nome da variante"
            formControlName="colorVariantNameCtrl"
          />
        </mat-form-field>
        <mat-form-field appearance="outline" class="product-color-size__color-form-field product-color-size__color-form-field--picker">
          <mat-label>Cor</mat-label>
          <input matInput formControlName="colorVariantCodeTextCtrl" />
          <ngx-colors
            class="product-color-size__color-form-picker"
            matSuffix
            ngx-colors-trigger
            formControlName="colorVariantPickerCtrl"
          ></ngx-colors>
          <mat-error
            *ngIf="
              this.colorForm.controls['colorVariantPickerCtrl'].hasError(
                'invalidColor'
              )
            "
          >
            Cor inválida.
          </mat-error>
        </mat-form-field>
      </form>
      <div class="product-color-size__color-list">
        <h3 class="product-color-size__color-list-title">Variantes de cor</h3>
        <ul class="product-color-size__color-list-items">
          <li
            class="product-color-size__color-list-item"
            *ngFor="let color of colors; let i = index"
          >
            <div class="product-color-size__color-list-item-info">
              <div
                class="product-color-size__color-list-item-color"
                [ngStyle]="{ 'background-color': color.code }"
              ></div>
              <span class="product-color-size__color-list-item-name">{{ color.name }}</span>
            </div>
            <button
              mat-icon-button
              color="warn"
              (click)="removeColor(i)"
              aria-label="Remover cor"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
