<form [formGroup]="form" class="product-form" (ngSubmit)="onSubmit()">
	<mat-form-field appearance="fill" class="full-width">
		<mat-label>Nome *</mat-label>
		<input matInput formControlName="name" />
		<mat-error *ngIf="form.get('name')?.invalid && form.get('name')?.touched">Nome é obrigatório</mat-error>
	</mat-form-field>

	<mat-form-field appearance="fill" class="full-width">
		<mat-label>Descrição</mat-label>
		<textarea matInput formControlName="description"></textarea>
	</mat-form-field>

	<mat-form-field appearance="fill" class="full-width">
		<mat-label>Foto (URL)</mat-label>
		<input matInput formControlName="photoUrl" />
	</mat-form-field>

	<mat-form-field appearance="fill" class="full-width">
		<mat-label>Estoque *</mat-label>
		<input matInput type="number" formControlName="stockAmount" min="0" />
		<mat-error *ngIf="form.get('stockAmount')?.invalid && form.get('stockAmount')?.touched">Estoque obrigatório e >= 0</mat-error>
	</mat-form-field>

	<mat-form-field appearance="fill" class="full-width">
		<mat-label>Valor de venda *</mat-label>
		<input matInput type="number" formControlName="saleValue" min="0" step="0.01" />
		<mat-error *ngIf="form.get('saleValue')?.invalid && form.get('saleValue')?.touched">Valor obrigatório e >= 0</mat-error>
	</mat-form-field>

	<mat-form-field appearance="fill" class="full-width">
		<mat-label>Valor bruto *</mat-label>
		<input matInput type="number" formControlName="grossValue" min="0" step="0.01" />
		<mat-error *ngIf="form.get('grossValue')?.invalid && form.get('grossValue')?.touched">Valor obrigatório e >= 0</mat-error>
	</mat-form-field>

	<mat-form-field appearance="fill" class="full-width">
		<mat-label>Categoria *</mat-label>
		<mat-select formControlName="categoryId">
			<mat-option value="">Selecione</mat-option>
			<mat-option *ngFor="let cat of categories" [value]="cat.id">{{cat.name}}</mat-option>
		</mat-select>
		<mat-error *ngIf="form.get('categoryId')?.invalid && form.get('categoryId')?.touched">Categoria obrigatória</mat-error>
	</mat-form-field>

	<div class="actions">
		<button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Salvar</button>
		<button mat-button type="button" (click)="onCancel()">Cancelar</button>
	</div>
</form>
