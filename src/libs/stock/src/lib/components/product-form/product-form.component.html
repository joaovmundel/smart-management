<form [formGroup]="form" class="product-form" (ngSubmit)="onSubmit($event)">
	<h1 class="product-form__title">Cadastro de Produto</h1>
	<div class="product-form__field-groups">
		<div class="product-form__field-group">
			<mat-form-field appearance="fill" class="full-width">
				<mat-label>Nome *</mat-label>
				<input matInput formControlName="name" tabindex="1"/>
				<mat-error *ngIf="form.get('name')?.invalid && form.get('name')?.touched">Nome é obrigatório</mat-error>
			</mat-form-field>
				<mat-form-field appearance="fill" class="full-width">
				<mat-label>Foto (URL)</mat-label>
				<input matInput formControlName="photoUrl" tabindex="3" />
			</mat-form-field>
			<mat-form-field appearance="fill" class="full-width">
				<mat-label>Categoria *</mat-label>
				<mat-select formControlName="categoryId" tabindex="5">
					<mat-option value="">Selecione</mat-option>
					<mat-option *ngFor="let cat of categories" [value]="cat.id">{{cat.name}}</mat-option>
				</mat-select>
				<mat-error *ngIf="form.get('categoryId')?.invalid && form.get('categoryId')?.touched">Categoria obrigatória</mat-error>
			</mat-form-field>
		</div>

		<div class="product-form__field-group">
			<mat-form-field appearance="fill" class="full-width">
				<mat-label>Estoque *</mat-label>
				<input matInput type="number" formControlName="stockAmount" min="0" tabindex="2"/>
				<mat-error *ngIf="form.get('stockAmount')?.invalid && form.get('stockAmount')?.touched">Estoque obrigatório e >= 0</mat-error>
			</mat-form-field>

			<mat-form-field appearance="fill" class="full-width">
				<mat-label>Valor de venda *</mat-label>
				<span matTextPrefix>R$&nbsp;</span>
				<input matInput type="number" formControlName="saleValue" min="0" step="0.01" tabindex="4"/>
				<mat-error *ngIf="form.get('saleValue')?.invalid && form.get('saleValue')?.touched">Valor obrigatório e >= 0</mat-error>
			</mat-form-field>

			<mat-form-field appearance="fill" class="full-width">
				<mat-label>Valor bruto *</mat-label>
				<span matTextPrefix>R$&nbsp;</span>
				<input matInput type="number" formControlName="grossValue" min="0" step="0.01" tabindex="6"/>
				<mat-error *ngIf="form.get('grossValue')?.invalid && form.get('grossValue')?.touched">Valor obrigatório e >= 0</mat-error>
			</mat-form-field>
		</div>
	</div>

	<mat-form-field appearance="fill" class="full-width">
		<mat-label>Descrição</mat-label>
		<textarea matInput formControlName="description" tabindex="7"></textarea>
	</mat-form-field>


	<div class="product-form__actions">
		<button mat-button type="button" (click)="onCancel()">Cancelar</button>
		<!-- <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Próximo</button> -->
		<button mat-raised-button color="primary" (click)="nextStep()">Próximo</button>
	</div>
</form>
