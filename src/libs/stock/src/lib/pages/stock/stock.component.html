<div class="stock-page">
  <div class="dashboard-cards">
    <ng-container *ngIf="isSmallScreen">
      <sm-simple-info-card
        title="Informações do estoque"
        [items]="stockInfo"
      ></sm-simple-info-card>
      <div class="currency-cards">
        <sm-info-card
          title="Valor em Estoque"
          [value]="(stockedValue | currency : 'BRL') || 0"
          icon="inventory_2"
          color="primary"
        >
        </sm-info-card>

        <sm-info-card
          title="Lucro Potencial"
          [value]="(potentialProfit | currency : 'BRL') || 0"
          icon="trending_up"
          color="success"
        >
        </sm-info-card>
      </div>
    </ng-container>
    <ng-container *ngIf="!isSmallScreen">
      <sm-info-card
        title="Valor em Estoque"
        [value]="(stockedValue | currency : 'BRL') || 0"
        icon="inventory_2"
        color="primary"
      >
      </sm-info-card>

      <sm-info-card
        title="Lucro Potencial"
        [value]="(potentialProfit | currency : 'BRL') || 0"
        icon="trending_up"
        color="success"
      >
      </sm-info-card>
      <sm-info-card
        title="Produtos em estado crítico"
        [value]="criticalProducts || 0"
        icon="warning"
        color="warn"
      >
      </sm-info-card>

      <sm-info-card
        title="Produtos em atenção"
        [value]="attentionProducts"
        icon="error_outline"
        color="accent"
      >
      </sm-info-card>
      <sm-info-card
        title="Produtos com excesso"
        [value]="excessProducts"
        icon="inventory"
        color="info"
      >
      </sm-info-card>

      <sm-info-card
        title="Total de produtos estocados"
        [value]="totalProducts"
        icon="category"
        color="primary"
      >
      </sm-info-card>
    </ng-container>
  </div>

  <!-- Tabela de estoque -->
  <sm-stock-table
    [products]="products"
    (editProduct)="onEditProduct($event)"
    (deleteProduct)="onDeleteProduct($event)"
  ></sm-stock-table>
</div>
