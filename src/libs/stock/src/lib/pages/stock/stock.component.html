<div class="stock-page">
    <!-- Painel Expansível para Formulário de Criação -->
    <div class="creation-area">

        <mat-expansion-panel [expanded]="isFormExpanded" (expandedChange)="isFormExpanded = $event"
            class="stock-creation-panel">

            <mat-expansion-panel-header>
                <mat-panel-title class="stock-creation-panel__title">
                    <mat-icon>add_circle</mat-icon>
                    Criar Novo Produto
                </mat-panel-title>
                <mat-panel-description>
                    {{ isFormExpanded ? 'Preencha os dados do produto' : 'Clique para adicionar um novo produto' }}
                </mat-panel-description>
            </mat-expansion-panel-header>

            <div class="stock-creation">
                <!-- <sm-stock-form (save)="onSave($event)" (cancelForm)="onCancel()"></sm-stock-form> -->
            </div>
        </mat-expansion-panel>
    </div>

    <!-- Tabela de produtos -->
    <!-- <sm-stock-table [stocks]="stocks" (editstock)="onEditstock($event)" -->
    <!-- (deletestock)="onDeletestock($event)"></sm-stock-table> -->
     <sm-stock-table [products]="products" (editProduct)="onEditProduct($event)" (deleteProduct)="onDeleteProduct($event)"></sm-stock-table>
</div>
