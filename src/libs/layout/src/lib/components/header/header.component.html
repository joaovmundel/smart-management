<mat-toolbar color="primary" class="header-navbar">
  <span class="logo">Smart Management</span>
  <nav>
    <ng-container *ngFor="let item of navItems">
      @if(!item.isDropdown) {
      <lib-navitem [item]="$any(item)"></lib-navitem>
      }@else {
      <lib-dropdown [item]="$any(item)"></lib-dropdown>
      }
    </ng-container>
  </nav>
</mat-toolbar>
